[package]
name = "waroxide"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Warcraft II on macOS: Rust port of the Wargus tools (Warcraft II data extractor, PUD converter and game launcher for Stratagus)"
license = "GPL-2.0-only"
default-run = "wartool"

[features]
default = ["gui"]
# Native message boxes and file pickers in the `waroxide` launcher. Without it
# the launcher falls back to console prompts.
gui = ["dep:rfd"]

[dependencies]
anyhow = "1"
flate2 = "1"
png = "0.17"
rfd = { version = "0.15", optional = true }
vorbis_rs = "0.5"

[[bin]]
name = "wartool"
path = "src/bin/wartool.rs"

[[bin]]
name = "pudconvert"
path = "src/bin/pudconvert.rs"

[[bin]]
name = "waroxide"
path = "src/bin/waroxide/main.rs"

[profile.release]
lto = true
